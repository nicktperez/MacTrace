[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mactrace"
version = "0.1.0"
description = "Local-first macOS endpoint activity monitor and investigation dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MacTrace contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psutil>=6,<8",
  "watchdog>=5,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
menubar = [
  "rumps>=0.4.0,<1",
]
packaging = [
  "pyinstaller>=6.10,<7",
  "rumps>=0.4.0,<1",
]

[project.scripts]
mactrace = "mactrace.cli:main"
mactrace-menubar = "mactrace.menubar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mactrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
